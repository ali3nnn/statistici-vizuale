<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistici Vizuale</title>

    <!-- Include Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Data -->
    <script src="./index.js" type="module"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #e8e8e8;
        }

        /* ===== Hide Leaflet attribution ===== */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* ===== Page layout ===== */
        #page {
            display: flex;
            min-height: 100vh;
        }

        /* ===== Controls sidebar ===== */
        #controls {
            width: 240px;
            background: #fff;
            border-right: 1px solid #ccc;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .tab-section {
            background: #f4f4f4;
            border-radius: 6px;
            padding: 0;
            margin-bottom: 6px;
        }

        .tab-bar {
            display: flex;
            gap: 0;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: #e8e8e8;
            font-size: 12px;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
            min-width: 0;
        }

        .tab-btn:hover {
            color: #444;
            background: #eee;
        }

        .tab-btn.active {
            color: #1a1a1a;
            background: #f4f4f4;
        }

        .tab-panel {
            display: none !important;
            flex-direction: column;
            gap: 6px;
            padding: 10px 10px 12px;
        }

        .tab-panel.active {
            display: flex !important;
        }

        .control-group-title {
            font-size: 12px;
            font-weight: 700;
            color: #333;
            padding: 8px 0 2px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 2px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-row span {
            font-size: 13px;
            color: #333;
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            cursor: pointer;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 20px;
            transition: background 0.2s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            bottom: 2px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked+.toggle-slider {
            background: #1a1a1a;
        }

        .toggle input:checked+.toggle-slider::before {
            transform: translateX(16px);
        }

        /* Palette grid */
        .palette-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .palette-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .palette-option:hover {
            border-color: #ddd;
        }

        .palette-option.active {
            border-color: #1a1a1a;
        }

        .palette-swatch {
            width: 60px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }

        .palette-name {
            font-size: 11px;
            color: #444;
        }

        /* Hue slider */
        .hue-slider {
            width: 100%;
            height: 16px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 8px;
            background: linear-gradient(to right,
                hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%),
                hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
            outline: none;
            cursor: pointer;
        }

        .hue-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            cursor: pointer;
        }

        .hue-preview {
            height: 14px;
            border-radius: 3px;
            border: 1px solid #ddd;
            margin-top: 4px;
        }

        /* Normalization button group */
        .norm-btn-group {
            display: flex;
            gap: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .norm-btn {
            flex: 1;
            padding: 5px 0;
            border: none;
            border-right: 1px solid #ccc;
            background: white;
            font-size: 11px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .norm-hint {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 4px;
        }

        .norm-btn:last-child {
            border-right: none;
        }

        .norm-btn:hover {
            background: #f0f0f0;
        }

        .norm-btn.active {
            background: #1a1a1a;
            color: white;
        }

        /* Top-right action buttons */
        .top-right-actions {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 10001;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-save-top {
            height: 36px;
            padding: 0 14px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-save-top:hover {
            background: #256b28;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
        }

        .btn-save-top.dirty {
            background: #e67e22;
        }

        .btn-save-top.dirty:hover {
            background: #d35400;
        }

        .btn-history-top {
            width: 36px;
            height: 36px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background 0.15s;
        }

        .btn-history-top:hover {
            background: #f0f0f0;
        }

        /* Undo / Redo buttons */
        .btn-undo-redo {
            width: 32px;
            height: 32px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            transition: background 0.15s, opacity 0.15s;
            color: #444;
        }

        .btn-undo-redo:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .btn-undo-redo:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* When history panel is open, hide undo/redo/save */
        .top-right-actions.panel-open .btn-undo-redo,
        .top-right-actions.panel-open .btn-save-top {
            display: none;
        }

        /* Saved stats slide panel */
        .saved-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: #fff;
            border-left: 1px solid #ccc;
            z-index: 10000;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 16px rgba(0,0,0,0.08);
        }

        .saved-panel.open {
            transform: translateX(0);
        }

        .saved-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            flex-shrink: 0;
        }

        .saved-panel-close {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            color: #666;
            padding: 0 4px;
        }

        .saved-panel-close:hover {
            color: #000;
        }

        .saved-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .saved-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }

        .saved-item:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        .saved-item-info {
            flex: 1;
            min-width: 0;
        }

        .saved-item-name {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-item-date {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .saved-item-delete {
            border: none;
            background: none;
            font-size: 16px;
            color: #bbb;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.12s, background 0.12s;
            flex-shrink: 0;
        }

        .saved-item-delete:hover {
            color: #c00;
            background: #fff0f0;
        }

        .saved-group {
            margin-bottom: 6px;
        }

        .saved-item-badge {
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            background: #1a1a1a;
            border-radius: 4px;
            padding: 1px 5px;
            flex-shrink: 0;
        }

        .saved-versions {
            display: none;
            flex-direction: column;
            margin-left: 12px;
            border-left: 2px solid #eee;
            padding-left: 8px;
            margin-top: 2px;
        }

        .saved-versions.open {
            display: flex;
        }

        .saved-version {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.12s;
        }

        .saved-version:hover {
            background: #f5f5f5;
        }

        .saved-version-label {
            font-size: 11px;
            font-weight: 600;
            color: #555;
            min-width: 22px;
        }

        .saved-version-date {
            font-size: 10px;
            color: #999;
            flex: 1;
        }

        .saved-version-delete {
            border: none;
            background: none;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 3px;
            transition: color 0.12s, background 0.12s;
            flex-shrink: 0;
        }

        .saved-version-delete:hover {
            color: #c00;
            background: #fff0f0;
        }

        .saved-list-empty {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 24px 0;
        }

        /* Hide during capture */
        .capturing .top-right-actions,
        .capturing .saved-panel {
            display: none !important;
        }

        .btn-reverse-palette {
            padding: 5px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
        }

        .btn-reverse-palette:hover {
            background: #f0f0f0;
        }

        .btn-reverse-palette.active {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        /* Zoom slider */
        .zoom-slider {
            width: 100%;
            cursor: pointer;
            accent-color: #1a1a1a;
        }

        .zoom-value {
            font-size: 11px;
            color: #888;
            text-align: center;
        }

        /* ===== Previews layout ===== */
        #previews {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            padding: 24px;
        }

        .preview-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .preview-label {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            letter-spacing: 0.5px;
        }

        /* ===== Capture area ===== */
        .capture-area {
            display: flex;
            flex-direction: column;
            background: white;
            border: none;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        .capture-area.ratio-4x5 {
            width: 480px;
            height: 600px;
        }

        .capture-area.ratio-9x16 {
            width: 360px;
            height: 640px;
        }

        /* ===== Header ===== */
        .header-bar {
            padding: 14px 18px 4px;
            text-align: center;
            background: transparent;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            outline: none;
            border: 1px dashed transparent;
            padding: 3px 8px;
            border-radius: 4px;
            transition: border-color 0.2s;
            line-height: 1.3;
            position: relative;
        }

        .title:hover,
        .title:focus {
            border-color: #bbb;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 400;
            color: #555;
            outline: none;
            border: 1px dashed transparent;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 2px;
            transition: border-color 0.2s;
            line-height: 1.4;
            position: relative;
        }

        .subtitle:hover,
        .subtitle:focus {
            border-color: #bbb;
        }

        /* ===== Map ===== */
        .map-wrapper {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
        }

        .county-label {
            overflow: visible !important;
        }

        .county-label .label-inner {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            white-space: nowrap;
            text-align: center;
            font-size: 13px;
            color: black;
            line-height: 1.2;
        }

        .county-label .label-code,
        .county-label .label-value {
            display: block;
        }

        .county-label.hidden {
            display: none !important;
        }

        /* Auto-align button */
        .btn-auto-align {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
        }

        .btn-auto-align:hover {
            background: #f0f0f0;
        }

        /* ===== Legend ===== */
        .legend {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 6px;
            padding: 8px 10px;
            z-index: 1000;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
            min-width: 50px;
            cursor: grab;
            user-select: none;
        }

        .legend.dragging {
            cursor: grabbing;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .legend-body {
            display: flex;
            gap: 5px;
            align-items: stretch;
        }

        .legend-gradient {
            width: 12px;
            height: 90px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .legend-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 10px;
            color: #444;
            font-weight: 500;
        }

        /* ===== Footer ===== */
        .footer-bar {
            padding: 4px 18px 10px;
            text-align: center;
            background: transparent;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            margin-top: auto;
        }

        .footer-note {
            font-size: 11px;
            color: #888;
            outline: none;
            border: 1px dashed transparent;
            padding: 2px 8px;
            border-radius: 4px;
            transition: border-color 0.2s;
            line-height: 1.4;
            position: relative;
        }

        .footer-note:hover,
        .footer-note:focus {
            border-color: #bbb;
        }

        /* Vertical drag grip indicator */
        .title::before,
        .subtitle::before,
        .footer-note::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 14px;
            border-radius: 2px;
            background: #ccc;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
        }

        .title:hover::before,
        .subtitle:hover::before,
        .footer-note:hover::before {
            opacity: 1;
        }

        .title.v-dragging,
        .subtitle.v-dragging,
        .footer-note.v-dragging {
            cursor: ns-resize;
            border-color: #999;
        }

        .capturing .title::before,
        .capturing .subtitle::before,
        .capturing .footer-note::before {
            display: none !important;
        }

        /* ===== Text editor toolbar ===== */
        .text-toolbar {
            display: none;
            position: fixed;
            z-index: 9999;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 4px 6px;
            gap: 2px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .text-toolbar button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }

        .text-toolbar button:hover {
            background: #f0f0f0;
        }

        .text-toolbar button.active {
            background: #e0e0e0;
            color: #111;
        }

        .text-toolbar .tb-sep {
            width: 1px;
            height: 20px;
            background: #ddd;
            margin: 0 3px;
            flex-shrink: 0;
        }

        .text-toolbar input[type="color"] {
            width: 24px;
            height: 24px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            padding: 1px;
        }

        .text-toolbar .tb-color-wrap {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .text-toolbar .tb-color-label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Hide toolbar during capture */
        .capturing .text-toolbar {
            display: none !important;
        }

        /* ===== Download buttons ===== */
        .btn-download {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            background: #1a1a1a;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .btn-download:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* ===== Capture mode ===== */
        .capturing #controls,
        .capturing .btn-download,
        .capturing .preview-label {
            display: none !important;
        }

        .capturing [contenteditable] {
            border-color: transparent !important;
        }

        .capturing .capture-area {
            border-color: transparent !important;
        }

        /* ===== AI Chat Drawer ===== */
        #ai-chat-drawer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            max-width: calc(100vw - 280px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
        }

        #ai-chat-drawer .chat-handle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #1a1a1a;
            color: white;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
        }

        #ai-chat-drawer .chat-handle:hover {
            background: #333;
        }

        #ai-chat-drawer .chat-handle-icon {
            font-size: 10px;
        }

        #ai-chat-drawer .chat-body {
            display: none;
            flex-direction: column;
            background: #fafafa;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            max-height: 350px;
        }

        #ai-chat-drawer.open .chat-body {
            display: flex;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 120px;
            max-height: 220px;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            max-width: 90%;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .chat-msg.system {
            background: #e8e8e8;
            color: #666;
            font-style: italic;
            align-self: center;
            text-align: center;
            max-width: 100%;
            font-size: 12px;
        }

        .chat-msg.user {
            background: #1a1a1a;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-msg.assistant {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-msg.error {
            background: #fff0f0;
            color: #c00;
            border: 1px solid #fcc;
            align-self: flex-start;
        }

        .chat-msg.loading {
            color: #999;
            font-style: italic;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .chat-input-row textarea {
            flex: 1;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
        }

        .chat-input-row textarea:focus {
            border-color: #999;
        }

        .chat-send-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            background: #1a1a1a;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            align-self: flex-end;
            transition: background 0.15s;
        }

        .chat-send-btn:hover {
            background: #333;
        }

        .chat-send-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .capturing #ai-chat-drawer {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="page">
        <!-- Controls sidebar -->
        <div id="controls">
            <!-- Tabs -->
            <div class="tab-section">
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="tab-4x5">4:5 Post</button>
                <button class="tab-btn" data-tab="tab-9x16">9:16 Story</button>
            </div>

            <!-- 4:5 tab -->
            <div class="tab-panel active" id="tab-4x5">
                <div class="control-section">
                    <label>Display</label>
                    <div class="toggle-row">
                        <span>County code</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-code-4x5" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span>Value</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-value-4x5" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <label>Zoom</label>
                    <input type="range" id="zoom-slider-4x5" class="zoom-slider" min="5" max="10" step="0.1"
                        value="7">
                    <div class="zoom-value" id="zoom-value-4x5">7.0</div>
                </div>

                <div class="control-section">
                    <label>Label size</label>
                    <input type="range" id="label-size-4x5" class="zoom-slider" min="8" max="24" step="1" value="13">
                    <div class="zoom-value" id="label-size-value-4x5">13px</div>
                </div>

                <div class="control-section">
                    <label>Label color</label>
                    <div class="custom-color-row">
                        <input type="color" id="label-color-4x5" value="#000000">
                        <span id="label-color-hex-4x5">#000000</span>
                    </div>
                </div>
            </div>

            <!-- 9:16 tab -->
            <div class="tab-panel" id="tab-9x16">
                <div class="control-section">
                    <label>Display</label>
                    <div class="toggle-row">
                        <span>County code</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-code-9x16" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span>Value</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-value-9x16" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <label>Zoom</label>
                    <input type="range" id="zoom-slider-9x16" class="zoom-slider" min="5" max="10" step="0.1"
                        value="7">
                    <div class="zoom-value" id="zoom-value-9x16">7.0</div>
                </div>

                <div class="control-section">
                    <label>Label size</label>
                    <input type="range" id="label-size-9x16" class="zoom-slider" min="8" max="24" step="1" value="13">
                    <div class="zoom-value" id="label-size-value-9x16">13px</div>
                </div>

                <div class="control-section">
                    <label>Label color</label>
                    <div class="custom-color-row">
                        <input type="color" id="label-color-9x16" value="#000000">
                        <span id="label-color-hex-9x16">#000000</span>
                    </div>
                </div>
            </div>
            </div><!-- /.tab-section -->

            <div class="control-section">
                <label>Color palette</label>
                <div class="palette-grid" id="palette-grid"></div>
                <button class="btn-reverse-palette" id="btn-reverse-palette">Reverse palette</button>
            </div>

            <div class="control-section">
                <label>Custom hue</label>
                <input type="range" id="custom-hue" class="hue-slider" min="0" max="360" step="1" value="0">
                <div class="hue-preview" id="hue-preview"></div>
            </div>

            <div class="control-group-title">Normalization</div>

            <div class="control-section">
                <div class="norm-btn-group" id="norm-btn-group">
                    <button class="norm-btn active" data-norm="none">None</button>
                    <button class="norm-btn" data-norm="logarithmic">Log</button>
                    <button class="norm-btn" data-norm="exponential">Exp</button>
                </div>
                <div class="norm-hint" id="norm-hint">Linear scale — values mapped as-is</div>
            </div>

        </div>

        <!-- Previews -->
        <div id="previews">
            <div class="preview-column">
                <span class="preview-label">4:5 Post</span>
                <div id="capture-4x5" class="capture-area ratio-4x5">
                    <div class="header-bar">
                        <div class="title" contenteditable="true" data-sync="title">Map Title</div>
                        <div class="subtitle" contenteditable="true" data-sync="subtitle">Click to edit subtitle
                        </div>
                    </div>
                    <div class="map-wrapper">
                        <div id="map-4x5" class="map"></div>
                        <div class="legend" id="legend-4x5"></div>
                    </div>
                    <div class="footer-bar">
                        <div class="footer-note" contenteditable="true" data-sync="footer">Source: click to edit</div>
                    </div>
                </div>
                <button class="btn-download" id="btn-download-4x5">Download 4:5</button>
            </div>

            <div class="preview-column">
                <span class="preview-label">9:16 Story</span>
                <div id="capture-9x16" class="capture-area ratio-9x16">
                    <div class="header-bar">
                        <div class="title" contenteditable="true" data-sync="title">Map Title</div>
                        <div class="subtitle" contenteditable="true" data-sync="subtitle">Click to edit subtitle
                        </div>
                    </div>
                    <div class="map-wrapper">
                        <div id="map-9x16" class="map"></div>
                        <div class="legend" id="legend-9x16"></div>
                    </div>
                    <div class="footer-bar">
                        <div class="footer-note" contenteditable="true" data-sync="footer">Source: click to edit</div>
                    </div>
                </div>
                <button class="btn-download" id="btn-download-9x16">Download 9:16</button>
            </div>
        </div>
    </div>

    <!-- Floating text editor toolbar -->
    <div class="text-toolbar" id="text-toolbar">
        <button id="tb-bold" title="Bold"><b>B</b></button>
        <button id="tb-italic" title="Italic"><i>I</i></button>
        <button id="tb-underline" title="Underline"><u>U</u></button>
        <div class="tb-sep"></div>
        <button id="tb-left" title="Align left" style="font-size:11px">&#9776;</button>
        <button id="tb-center" title="Align center" style="font-size:11px">&#9776;</button>
        <button id="tb-right" title="Align right" style="font-size:11px">&#9776;</button>
        <div class="tb-sep"></div>
        <div class="tb-color-wrap">
            <span class="tb-color-label">A</span>
            <input type="color" id="tb-text-color" value="#000000" title="Text color">
        </div>
        <div class="tb-color-wrap">
            <span class="tb-color-label" style="background:#ff0;padding:0 2px;border-radius:2px">A</span>
            <input type="color" id="tb-bg-color" value="#ffffff" title="Background color">
        </div>
    </div>

    <!-- Top-right action buttons -->
    <div class="top-right-actions" id="top-right-actions">
        <button class="btn-undo-redo" id="btn-undo" title="Undo (Ctrl+Z)" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
        <button class="btn-undo-redo" id="btn-redo" title="Redo (Ctrl+Y)" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg></button>
        <button class="btn-save-top" id="btn-save-config" title="Save"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
        <button class="btn-history-top" id="saved-toggle-btn" title="History"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
    </div>
    <div class="saved-panel" id="saved-panel">
        <div class="saved-panel-header">
            <span>Saved Statistics</span>
            <button class="saved-panel-close" id="saved-panel-close">&times;</button>
        </div>
        <div class="saved-list" id="saved-list"></div>
    </div>
</body>

</html>
